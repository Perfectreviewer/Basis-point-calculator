<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1f3d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d2d4f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a2540;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leftPanelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a4a7a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rightPanelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a1a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a2010;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Decorative circles -->
  <circle cx="-40" cy="-40" r="200" fill="none" stroke="#2a6496" stroke-width="1" stroke-opacity="0.2"/>
  <circle cx="-40" cy="-40" r="280" fill="none" stroke="#2a6496" stroke-width="1" stroke-opacity="0.1"/>
  <circle cx="1240" cy="670" r="200" fill="none" stroke="#c2410c" stroke-width="1" stroke-opacity="0.2"/>
  <circle cx="1240" cy="670" r="280" fill="none" stroke="#c2410c" stroke-width="1" stroke-opacity="0.1"/>

  <!-- Top accent strip -->
  <rect x="0" y="0" width="1200" height="5" fill="#3b9eff" rx="0"/>

  <!-- ===== TITLE AREA ===== -->
  <text x="600" y="72" font-family="'Segoe UI', Arial, sans-serif" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Fed Rate Hike Decoded</text>

  <text x="600" y="115" font-family="'Segoe UI', Arial, sans-serif" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
    <tspan fill="#3b9eff">25 bps</tspan>
    <tspan fill="#aaaaaa" font-size="28" font-weight="400">  vs  </tspan>
    <tspan fill="#fb923c">50 bps</tspan>
    <tspan fill="#dddddd" font-size="24" font-weight="400"> — What It Costs You</tspan>
  </text>

  <line x1="200" y1="135" x2="1000" y2="135" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- ===== LEFT PANEL — 25 bps ===== -->
  <rect x="60" y="155" width="460" height="370" rx="16" fill="url(#leftPanelGrad)" stroke="#3b9eff" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect x="60" y="155" width="460" height="370" rx="16" fill="none" stroke="#3b9eff" stroke-width="8" stroke-opacity="0.08"/>

  <!-- Panel label pill -->
  <rect x="185" y="142" width="210" height="30" rx="15" fill="#3b9eff"/>
  <text x="290" y="162" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">STANDARD MOVE</text>

  <!-- Bar chart icon — steady, moderate bars -->
  <rect x="100" y="235" width="18" height="40" rx="3" fill="#3b9eff" opacity="0.4"/>
  <rect x="126" y="218" width="18" height="57" rx="3" fill="#3b9eff" opacity="0.6"/>
  <rect x="152" y="205" width="18" height="70" rx="3" fill="#3b9eff" opacity="0.85"/>
  <rect x="178" y="220" width="18" height="55" rx="3" fill="#3b9eff" opacity="0.55"/>
  <polyline points="100,273 126,265 152,248 178,247 208,225" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="208" cy="225" r="5" fill="#7dd3fc"/>

  <!-- Main BPS value -->
  <text x="390" y="240" font-family="'Segoe UI', Arial, sans-serif" font-size="80" font-weight="900" fill="#3b9eff" text-anchor="middle" filter="url(#glow)">25</text>
  <text x="390" y="278" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#7dd3fc" text-anchor="middle" letter-spacing="2">BPS</text>

  <line x1="100" y1="305" x2="480" y2="305" stroke="#3b9eff" stroke-width="0.8" stroke-opacity="0.3"/>

  <!-- Percentage -->
  <text x="290" y="340" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#94c8f5" text-anchor="middle">
    <tspan font-weight="700" fill="#ffffff">25 bps</tspan> = 0.25% = 0.0025
  </text>

  <!-- Impact stats -->
  <rect x="90" y="358" width="380" height="58" rx="10" fill="#0a2040" fill-opacity="0.6"/>
  <text x="280" y="379" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#7dd3fc" text-anchor="middle" letter-spacing="1">$400K MORTGAGE IMPACT</text>
  <text x="280" y="403" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">
    <tspan fill="#3b9eff">+$66/mo</tspan>
    <tspan fill="#94a3b8" font-size="14">  ·  </tspan>
    <tspan fill="#7dd3fc">+$23,590 total</tspan>
  </text>

  <!-- Bullet points -->
  <circle cx="110" cy="441" r="4" fill="#3b9eff"/>
  <text x="124" y="446" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94c8f5">The Fed's default rate increment</text>

  <circle cx="110" cy="469" r="4" fill="#3b9eff"/>
  <text x="124" y="474" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94c8f5">Signals measured, gradual policy</text>

  <circle cx="110" cy="497" r="4" fill="#3b9eff"/>
  <text x="124" y="502" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94c8f5">Markets typically expect this move</text>

  <!-- ===== CENTER DIVIDER ===== -->
  <circle cx="600" cy="330" r="52" fill="#1a2a3a" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.2"/>
  <text x="600" y="350" font-family="'Segoe UI', Arial, sans-serif" font-size="50" font-weight="900" fill="#f59e0b" text-anchor="middle" filter="url(#glow)">vs</text>

  <line x1="520" y1="330" x2="548" y2="330" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="652" y1="330" x2="680" y2="330" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3"/>

  <text x="600" y="405" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#888888" text-anchor="middle" letter-spacing="0.5">IMPACT RATIO</text>
  <text x="600" y="423" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="800" fill="#f59e0b" text-anchor="middle">2×</text>

  <!-- ===== RIGHT PANEL — 50 bps ===== -->
  <rect x="680" y="155" width="460" height="370" rx="16" fill="url(#rightPanelGrad)" stroke="#fb923c" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect x="680" y="155" width="460" height="370" rx="16" fill="none" stroke="#fb923c" stroke-width="8" stroke-opacity="0.08"/>

  <!-- Panel label pill -->
  <rect x="810" y="142" width="210" height="30" rx="15" fill="#ea580c"/>
  <text x="915" y="162" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">AGGRESSIVE MOVE</text>

  <!-- Bar chart icon — steeper, taller bars -->
  <rect x="720" y="225" width="18" height="50" rx="3" fill="#fb923c" opacity="0.4"/>
  <rect x="746" y="200" width="18" height="75" rx="3" fill="#fb923c" opacity="0.6"/>
  <rect x="772" y="178" width="18" height="97" rx="3" fill="#fb923c" opacity="0.85"/>
  <rect x="798" y="195" width="18" height="80" rx="3" fill="#fb923c" opacity="0.6"/>
  <polyline points="720,273 746,268 772,242 798,240 828,215" fill="none" stroke="#fdba74" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="828" cy="215" r="5" fill="#fdba74"/>

  <!-- Main BPS value -->
  <text x="1010" y="240" font-family="'Segoe UI', Arial, sans-serif" font-size="80" font-weight="900" fill="#fb923c" text-anchor="middle" filter="url(#glow)">50</text>
  <text x="1010" y="278" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#fdba74" text-anchor="middle" letter-spacing="2">BPS</text>

  <line x1="720" y1="305" x2="1100" y2="305" stroke="#fb923c" stroke-width="0.8" stroke-opacity="0.3"/>

  <!-- Percentage -->
  <text x="910" y="340" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#fdba74" text-anchor="middle">
    <tspan font-weight="700" fill="#ffffff">50 bps</tspan> = 0.50% = 0.0050
  </text>

  <!-- Impact stats -->
  <rect x="710" y="358" width="380" height="58" rx="10" fill="#2a0a00" fill-opacity="0.6"/>
  <text x="900" y="379" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#fdba74" text-anchor="middle" letter-spacing="1">$400K MORTGAGE IMPACT</text>
  <text x="900" y="403" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">
    <tspan fill="#fb923c">+$133/mo</tspan>
    <tspan fill="#94a3b8" font-size="14">  ·  </tspan>
    <tspan fill="#fdba74">+$47,590 total</tspan>
  </text>

  <!-- Bullet points -->
  <circle cx="730" cy="441" r="4" fill="#fb923c"/>
  <text x="744" y="446" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#fdba74">Signals urgency — Fed in a hurry</text>

  <circle cx="730" cy="469" r="4" fill="#fb923c"/>
  <text x="744" y="474" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#fdba74">Used when fighting high inflation</text>

  <circle cx="730" cy="497" r="4" fill="#fb923c"/>
  <text x="744" y="502" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#fdba74">Often surprises financial markets</text>

  <!-- ===== BOTTOM FORMULA BAR ===== -->
  <rect x="60" y="548" width="1080" height="58" rx="12" fill="#0f2d50" stroke="#3b9eff" stroke-width="1" stroke-opacity="0.4"/>
  <text x="600" y="584" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">
    <tspan fill="#3b9eff">25 bps</tspan>
    <tspan fill="#f59e0b"> = </tspan>
    <tspan fill="#ffffff">0.25%</tspan>
    <tspan fill="#888888">    |    </tspan>
    <tspan fill="#fb923c">50 bps</tspan>
    <tspan fill="#f59e0b"> = </tspan>
    <tspan fill="#ffffff">0.50%</tspan>
    <tspan fill="#888888">    |    </tspan>
    <tspan fill="#aaaaaa">100 bps = 1.00%</tspan>
  </text>

  <!-- Watermark -->
  <text x="600" y="622" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" opacity="0.35" letter-spacing="2">BASISPOINTCALCULATOR.COM</text>

</svg>
