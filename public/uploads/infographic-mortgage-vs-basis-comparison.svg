<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1f3d"/>
      <stop offset="100%" style="stop-color:#0c2540"/>
    </linearGradient>
    <linearGradient id="leftPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c2a14"/>
      <stop offset="100%" style="stop-color:#14321a"/>
    </linearGradient>
    <linearGradient id="rightPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e2240"/>
      <stop offset="100%" style="stop-color:#0f2d52"/>
    </linearGradient>
    <pattern id="dotgrid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#ffffff" fill-opacity="0.03"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="380" fill="url(#bg2)" rx="14"/>
  <rect width="900" height="380" fill="url(#dotgrid2)" rx="14"/>
  <rect x="0" y="0" width="900" height="4" rx="2" fill="#a78bfa"/>

  <!-- Title -->
  <text x="450" y="42" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">Mortgage Points vs Basis Points</text>
  <text x="450" y="62" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Two completely different "points" — here's what each one actually means</text>

  <!-- LEFT PANEL: Mortgage Points -->
  <rect x="40" y="80" width="375" height="260" rx="12" fill="url(#leftPanel)" stroke="#4ade80" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Left label pill -->
  <rect x="130" y="68" width="195" height="28" rx="14" fill="#16a34a"/>
  <text x="227" y="86" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">MORTGAGE POINT</text>

  <!-- Left big symbol -->
  <text x="100" y="168" font-family="'Segoe UI',Arial,sans-serif" font-size="70" font-weight="900" fill="#4ade80" text-anchor="middle" opacity="0.15">$</text>
  <text x="227" y="148" font-family="'Segoe UI',Arial,sans-serif" font-size="46" font-weight="900" fill="#4ade80" text-anchor="middle">1 pt</text>
  <text x="227" y="172" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#86efac" text-anchor="middle">= 1% of loan amount</text>

  <line x1="70" y1="190" x2="390" y2="190" stroke="#4ade80" stroke-width="0.6" stroke-opacity="0.25"/>

  <!-- Left bullets -->
  <circle cx="68" cy="212" r="4" fill="#4ade80"/>
  <text x="82" y="217" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" fill="#d1fae5">Paid <tspan font-weight="700">upfront</tspan> at closing</text>

  <circle cx="68" cy="240" r="4" fill="#4ade80"/>
  <text x="82" y="245" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" fill="#d1fae5">Buys down your <tspan font-weight="700">interest rate</tspan></text>

  <circle cx="68" cy="268" r="4" fill="#4ade80"/>
  <text x="82" y="273" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" fill="#d1fae5">Typically <tspan font-weight="700">−25 bps</tspan> per point</text>

  <!-- Left example box -->
  <rect x="58" y="288" width="340" height="38" rx="8" fill="#15803d" fill-opacity="0.4" stroke="#4ade80" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="228" y="312" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">
    <tspan font-weight="700">Example:</tspan> $250k loan × 1% = <tspan font-weight="800" fill="#4ade80">$2,500 upfront</tspan>
  </text>

  <!-- CENTER: VS circle -->
  <circle cx="450" cy="210" r="42" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="450" y="218" font-family="'Segoe UI',Arial,sans-serif" font-size="26" font-weight="900" fill="#f1f5f9" text-anchor="middle">VS</text>
  <line x1="415" y1="210" x2="408" y2="210" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="492" y1="210" x2="485" y2="210" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- RIGHT PANEL: Basis Points -->
  <rect x="485" y="80" width="375" height="260" rx="12" fill="url(#rightPanel)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Right label pill -->
  <rect x="575" y="68" width="195" height="28" rx="14" fill="#0284c7"/>
  <text x="672" y="86" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">BASIS POINT (bps)</text>

  <!-- Right big symbol -->
  <text x="860" y="168" font-family="'Segoe UI',Arial,sans-serif" font-size="70" font-weight="900" fill="#38bdf8" text-anchor="middle" opacity="0.15">%</text>
  <text x="672" y="148" font-family="'Segoe UI',Arial,sans-serif" font-size="46" font-weight="900" fill="#38bdf8" text-anchor="middle">1 bps</text>
  <text x="672" y="172" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#7dd3fc" text-anchor="middle">= 0.01% = 0.0001</text>

  <line x1="515" y1="190" x2="840" y2="190" stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.25"/>

  <!-- Right bullets -->
  <circle cx="513" cy="212" r="4" fill="#38bdf8"/>
  <text x="527" y="217" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" fill="#dbeafe">Measures <tspan font-weight="700">rate movements</tspan></text>

  <circle cx="513" cy="240" r="4" fill="#38bdf8"/>
  <text x="527" y="245" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" fill="#dbeafe"><tspan font-weight="700">100 bps</tspan> = 1 percentage point</text>

  <circle cx="513" cy="268" r="4" fill="#38bdf8"/>
  <text x="527" y="273" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" fill="#dbeafe">Used by <tspan font-weight="700">Fed, lenders, markets</tspan></text>

  <!-- Right example box -->
  <rect x="503" y="288" width="340" height="38" rx="8" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="673" y="312" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">
    <tspan font-weight="700">Example:</tspan> Rate rose 25 bps = <tspan font-weight="800" fill="#38bdf8">+0.25% higher rate</tspan>
  </text>

  <!-- Watermark -->
  <text x="450" y="368" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" opacity="0.2" letter-spacing="2">BASISPOINTCALCULATOR.COM</text>
</svg>
