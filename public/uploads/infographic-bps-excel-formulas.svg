<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1f3d"/>
      <stop offset="100%" style="stop-color:#0d2a4a"/>
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#111827"/>
      <stop offset="100%" style="stop-color:#0d1520"/>
    </linearGradient>
    <pattern id="dots2" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#ffffff" fill-opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="900" height="420" fill="url(#bg2)" rx="14"/>
  <rect width="900" height="420" fill="url(#dots2)" rx="14"/>
  <rect x="0" y="0" width="900" height="4" rx="2" fill="#4ade80"/>

  <!-- Title -->
  <text x="450" y="38" font-family="'Segoe UI',Arial,sans-serif" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">How to Calculate Basis Points in Excel</text>
  <text x="450" y="58" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">4 ready-to-use formulas — copy directly into your spreadsheet</text>

  <!-- Spreadsheet container -->
  <rect x="30" y="72" width="840" height="300" rx="10" fill="url(#sheetGrad)" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- Spreadsheet title bar -->
  <rect x="30" y="72" width="840" height="30" rx="10" fill="#0f2040"/>
  <rect x="30" y="88" width="840" height="14" fill="#0f2040"/>
  <!-- traffic light dots -->
  <circle cx="52" cy="87" r="5" fill="#ef4444"/>
  <circle cx="68" cy="87" r="5" fill="#f59e0b"/>
  <circle cx="84" cy="87" r="5" fill="#4ade80"/>
  <text x="450" y="91" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#475569" text-anchor="middle">basis_points_formulas.xlsx</text>

  <!-- Column headers row -->
  <rect x="30" y="102" width="840" height="26" fill="#0d1e35"/>
  <!-- Row number col -->
  <rect x="30" y="102" width="40" height="26" fill="#0a1628"/>
  <text x="50" y="119" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#334155" text-anchor="middle">#</text>
  <!-- Col A -->
  <text x="140" y="119" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">A — Description</text>
  <!-- Col B -->
  <text x="330" y="119" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">B — Rate 1 / Input</text>
  <!-- Col C -->
  <text x="510" y="119" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">C — Rate 2 / Input</text>
  <!-- Col D -->
  <text x="710" y="119" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#4ade80" text-anchor="middle">D — Formula (Result)</text>

  <!-- Grid lines -->
  <line x1="70" y1="102" x2="70" y2="372" stroke="#1e3a5f" stroke-width="1"/>
  <line x1="240" y1="102" x2="240" y2="372" stroke="#1e3a5f" stroke-width="1"/>
  <line x1="420" y1="102" x2="420" y2="372" stroke="#1e3a5f" stroke-width="1"/>
  <line x1="600" y1="102" x2="600" y2="372" stroke="#1e3a5f" stroke-width="1"/>

  <!-- ===== ROW 1: BPS between two rates ===== -->
  <rect x="30" y="128" width="840" height="52" fill="#0d1a2e"/>
  <text x="50" y="157" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#334155" text-anchor="middle">2</text>
  <text x="155" y="148" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#94a3b8">BPS between</text>
  <text x="155" y="168" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#94a3b8">two rates</text>
  <text x="330" y="157" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#7dd3fc" text-anchor="middle">0.065 (6.5%)</text>
  <text x="510" y="157" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#7dd3fc" text-anchor="middle">0.0625 (6.25%)</text>
  <!-- Formula cell -->
  <rect x="602" y="130" width="266" height="48" rx="4" fill="#0a2010" stroke="#4ade80" stroke-width="1"/>
  <text x="735" y="151" font-family="'Courier New',monospace" font-size="13" fill="#4ade80" text-anchor="middle">=(B2-C2)*10000</text>
  <text x="735" y="170" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#86efac" text-anchor="middle">→ Result: 25 BPS</text>

  <!-- ===== ROW 2: Percent to BPS ===== -->
  <rect x="30" y="180" width="840" height="52" fill="#0a1628"/>
  <text x="50" y="209" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#334155" text-anchor="middle">3</text>
  <text x="155" y="200" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#94a3b8">Convert %</text>
  <text x="155" y="220" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#94a3b8">to BPS</text>
  <text x="330" y="209" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#7dd3fc" text-anchor="middle">0.0075 (0.75%)</text>
  <text x="510" y="209" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#334155" text-anchor="middle">— (not needed)</text>
  <rect x="602" y="182" width="266" height="48" rx="4" fill="#0a2010" stroke="#4ade80" stroke-width="1"/>
  <text x="735" y="203" font-family="'Courier New',monospace" font-size="13" fill="#4ade80" text-anchor="middle">=B3*10000</text>
  <text x="735" y="222" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#86efac" text-anchor="middle">→ Result: 75 BPS</text>

  <!-- ===== ROW 3: BPS to Percent ===== -->
  <rect x="30" y="232" width="840" height="52" fill="#0d1a2e"/>
  <text x="50" y="261" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#334155" text-anchor="middle">4</text>
  <text x="155" y="252" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#94a3b8">Convert BPS</text>
  <text x="155" y="272" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#94a3b8">to percent</text>
  <text x="330" y="261" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#7dd3fc" text-anchor="middle">50 (BPS)</text>
  <text x="510" y="261" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#334155" text-anchor="middle">— (not needed)</text>
  <rect x="602" y="234" width="266" height="48" rx="4" fill="#0a2010" stroke="#4ade80" stroke-width="1"/>
  <text x="735" y="255" font-family="'Courier New',monospace" font-size="13" fill="#4ade80" text-anchor="middle">=B4/10000</text>
  <text x="735" y="274" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#86efac" text-anchor="middle">→ Result: 0.50%</text>

  <!-- ===== ROW 4: Dollar impact ===== -->
  <rect x="30" y="284" width="840" height="52" fill="#0a1628"/>
  <text x="50" y="313" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#334155" text-anchor="middle">5</text>
  <text x="155" y="304" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#94a3b8">Dollar impact</text>
  <text x="155" y="324" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#94a3b8">of BPS on loan</text>
  <text x="330" y="313" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#fbbf24" text-anchor="middle">300000 (loan $)</text>
  <text x="510" y="313" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#fbbf24" text-anchor="middle">25 (BPS)</text>
  <rect x="602" y="286" width="266" height="48" rx="4" fill="#1c1200" stroke="#f59e0b" stroke-width="1"/>
  <text x="735" y="307" font-family="'Courier New',monospace" font-size="13" fill="#f59e0b" text-anchor="middle">=B5*(C5/10000)</text>
  <text x="735" y="326" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#fde68a" text-anchor="middle">→ Result: $750/yr</text>

  <!-- Row border lines -->
  <line x1="30" y1="180" x2="870" y2="180" stroke="#1e3a5f" stroke-width="0.8"/>
  <line x1="30" y1="232" x2="870" y2="232" stroke="#1e3a5f" stroke-width="0.8"/>
  <line x1="30" y1="284" x2="870" y2="284" stroke="#1e3a5f" stroke-width="0.8"/>
  <line x1="30" y1="336" x2="870" y2="336" stroke="#1e3a5f" stroke-width="0.8"/>

  <!-- Tip box -->
  <rect x="30" y="344" width="840" height="28" rx="0" fill="#051028"/>
  <rect x="30" y="358" width="840" height="14" rx="10" fill="#051028"/>
  <text x="450" y="362" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#475569" text-anchor="middle">💡 Tip: Enter rates as decimals (6.5% = 0.065). Format column D cells as "Number" with 0 decimal places to show clean BPS values.</text>

  <!-- Watermark -->
  <text x="450" y="408" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" opacity="0.2" letter-spacing="2">BASISPOINTCALCULATOR.COM</text>
</svg>
